<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@font-face {
    font-family: STSong-Light;
    src: url('STSong-Light');
    -pdf-font-name: STSong-Light;
    -pdf-use-cidfont: true;
}
@page {
    size: A4 portrait;
    margin: 1.2cm 1.5cm 1cm 1.5cm;
}
* {
    box-sizing: border-box;
}
body {
    font-family: STSong-Light, SimSun, Arial, Helvetica, sans-serif;
    font-size: 11px;
    line-height: 1.4;
    color: #000;
    margin: 0;
    padding: 0;
}
.receipt-wrap {
    width: 100%;
}
h2 {
    text-align: center;
    font-size: 18px;
    margin: 0 0 2px 0;
    letter-spacing: 2px;
    font-weight: bold;
}
h3 {
    text-align: center;
    font-size: 15px;
    margin: 0 0 10px 0;
    letter-spacing: 8px;
    font-weight: bold;
}
.info-row {
    width: 100%;
    margin-bottom: 5px;
    font-size: 11px;
}
.info-row td {
    padding: 1px 0;
}
.mtbl {
    width: 100%;
    border-collapse: collapse;
    border: 2px solid #000;
    table-layout: fixed;
}
.mtbl tr {
    page-break-inside: avoid;
    -pdf-keep-in-frame-mode: shrink;
}
.mtbl td {
    border: 1px solid #333;
    padding: 4px 8px;
    font-size: 11px;
    vertical-align: middle;
    word-wrap: break-word;
}
.mtbl .lb {
    background-color: #f0f0f0;
    font-weight: bold;
    text-align: center;
    width: 15%;
}
.sign-td {
    border: none !important;
    padding: 8px 0 0 0 !important;
}
.sign-table {
    width: 100%;
    border-collapse: collapse;
}
.sign-table td {
    border: none !important;
    padding: 4px 0;
    font-size: 11px;
    vertical-align: bottom;
}
.seal-area {
    text-align: right;
    padding-right: 10px !important;
}
.note {
    text-align: center;
    font-size: 9px;
    color: #888;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="receipt-wrap">
    <h2>天津俊途人力资源服务有限公司</h2>
    <h3>电 子 收 据</h3>

    <table class="info-row" cellpadding="0" cellspacing="0">
        <tr>
            <td style="text-align:left; width:50%;">填制日期：{{ payment_date }}</td>
            <td style="text-align:right; width:50%;">票号：{{ receipt_number }}</td>
        </tr>
    </table>

    <table class="mtbl" cellpadding="0" cellspacing="0">
        <tr>
            <td class="lb">付款人</td>
            <td style="width:35%;">{{ payer_name }}</td>
            <td class="lb" style="width:15%;">收款人</td>
            <td style="width:35%;">天津俊途人力资源服务有限公司</td>
        </tr>
        <tr>
            <td class="lb" colspan="2">收款内容</td>
            <td class="lb" colspan="2">金额</td>
        </tr>
        {{ items_html }}
        <tr>
            <td class="lb">合计金额（大写）</td>
            <td>{{ total_amount_cn }}</td>
            <td class="lb">合计金额（小写）</td>
            <td style="text-align:right; font-weight:bold; font-size:13px;">{{ total_amount_display }}</td>
        </tr>
        <tr>
            <td class="lb">备注</td>
            <td colspan="3">{{ notes }}</td>
        </tr>
        <tr>
            <td colspan="4" class="sign-td">
                <table class="sign-table" cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="width:50%;">开具人：{{ issuer }}</td>
                        <td style="width:50%; text-align:right;" class="seal-area">收款单位（盖章）：{{ seal_img }}</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <div class="note">
        <p>本收据仅作对账使用，款项未实际到账前不视为已收款。</p>
    </div>
</div>
</body>
</html>

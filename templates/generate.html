{% extends "base.html" %}

{% block title %}开具收据 - 财务收据系统{% endblock %}

{% block page_title %}开具收据{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">收据信息</div>
            <div class="card-body">
                <form id="receiptForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">收据编号 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="receipt_number" required>
                                <button class="btn btn-outline-primary" type="button" id="generateNumberBtn">
                                    <i class="fas fa-bolt"></i> 自动生成
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">日期 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="payment_date" required>
                        </div>
                    </div>
                    
                    <h6 class="mb-3 text-primary">付款人信息</h6>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">付款人名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="payer_name" required autocomplete="off">
                            <div id="payerSuggestions" class="list-group position-absolute w-100" style="z-index:1000; display:none;"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">付款人税号</label>
                            <input type="text" class="form-control" id="payer_tax_id">
                        </div>
                    </div>
                    
                    <h6 class="mb-3 text-primary">收款人信息</h6>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">收款人名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="payee_name" required autocomplete="off">
                            <div id="payeeSuggestions" class="list-group position-absolute w-100" style="z-index:1000; display:none;"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">收款人税号</label>
                            <input type="text" class="form-control" id="payee_tax_id">
                        </div>
                    </div>
                    
                    <h6 class="mb-3 text-primary">收款信息</h6>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">金额 <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <select class="form-select" id="currency" style="max-width: 100px;">
                                    <option value="CNY">¥ CNY</option>
                                    <option value="USD">$ USD</option>
                                </select>
                                <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">税率 (%)</label>
                            <input type="number" class="form-control" id="tax_rate" step="0.01" min="0" max="100" value="0">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">税额</label>
                            <input type="text" class="form-control" id="tax_amount" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">总金额</label>
                            <input type="text" class="form-control" id="total_amount" readonly style="font-weight: bold; color: #d32f2f;">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">收款事由 <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="purpose" rows="3" required></textarea>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="notes" rows="2"></textarea>
                        </div>
                    </div>
                    
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> 保存收据
                        </button>
                        <button type="button" class="btn btn-success btn-lg ms-3" id="saveAndPdfBtn">
                            <i class="fas fa-file-pdf"></i> 保存并生成PDF
                        </button>
                        <button type="reset" class="btn btn-secondary btn-lg ms-3">
                            <i class="fas fa-redo"></i> 重置
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-lg-4">
        <div class="card sticky-top" style="top: 20px;">
            <div class="card-header">实时预览</div>
            <div class="card-body" style="max-height: 800px; overflow-y: auto;">
                <div id="receiptPreview">
                    <div class="text-center text-muted">
                        <i class="fas fa-file-alt fa-3x mb-3"></i>
                        <p>填写表单以预览收据</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    $('#payment_date').val(new Date().toISOString().split('T')[0]);
    
    $('#generateNumberBtn').click(generateReceiptNumber);
    $('#amount, #tax_rate').on('input', calculateTax);
    $('#receiptForm').submit(function(e) { e.preventDefault(); saveReceipt(false); });
    $('#saveAndPdfBtn').click(function() { saveReceipt(true); });
    
    // 付款人自动搜索
    $('#payer_name').on('input', function() {
        searchPayers($(this).val());
    });
    
    // 收款人自动搜索
    $('#payee_name').on('input', function() {
        searchPayees($(this).val());
    });
    
    // 点击外部关闭建议列表
    $(document).click(function(e) {
        if (!$(e.target).closest('#payer_name, #payerSuggestions').length) {
            $('#payerSuggestions').hide();
        }
        if (!$(e.target).closest('#payee_name, #payeeSuggestions').length) {
            $('#payeeSuggestions').hide();
        }
    });
});

async function searchPayers(keyword) {
    if (keyword.length < 1) {
        $('#payerSuggestions').hide();
        return;
    }
    try {
        const data = await apiRequest('/api/payers?keyword=' + encodeURIComponent(keyword));
        if (data.payers && data.payers.length > 0) {
            let html = '';
            data.payers.forEach(p => {
                html += `<a href="#" class="list-group-item list-group-item-action" onclick="selectPayer('${p.name}', '${p.tax_id || ''}'); return false;">
                    <strong>${p.name}</strong>${p.tax_id ? '<br><small class="text-muted">税号: ' + p.tax_id + '</small>' : ''}
                </a>`;
            });
            $('#payerSuggestions').html(html).show();
        } else {
            $('#payerSuggestions').hide();
        }
    } catch (e) {
        $('#payerSuggestions').hide();
    }
}

function selectPayer(name, taxId) {
    $('#payer_name').val(name);
    $('#payer_tax_id').val(taxId);
    $('#payerSuggestions').hide();
}

async function searchPayees(keyword) {
    if (keyword.length < 1) {
        $('#payeeSuggestions').hide();
        return;
    }
    try {
        const data = await apiRequest('/api/payees?keyword=' + encodeURIComponent(keyword));
        if (data.payees && data.payees.length > 0) {
            let html = '';
            data.payees.forEach(p => {
                html += `<a href="#" class="list-group-item list-group-item-action" onclick="selectPayee('${p.name}', '${p.tax_id || ''}'); return false;">
                    <strong>${p.name}</strong>${p.tax_id ? '<br><small class="text-muted">税号: ' + p.tax_id + '</small>' : ''}
                </a>`;
            });
            $('#payeeSuggestions').html(html).show();
        } else {
            $('#payeeSuggestions').hide();
        }
    } catch (e) {
        $('#payeeSuggestions').hide();
    }
}

function selectPayee(name, taxId) {
    $('#payee_name').val(name);
    $('#payee_tax_id').val(taxId);
    $('#payeeSuggestions').hide();
}

async function generateReceiptNumber() {
    try {
        const data = await apiRequest('/api/receipts/generate-number');
        $('#receipt_number').val(data.receipt_number);
    } catch (error) {}
}

function calculateTax() {
    const amount = parseFloat($('#amount').val()) || 0;
    const taxRate = parseFloat($('#tax_rate').val()) || 0;
    const taxAmount = amount * taxRate / 100;
    const totalAmount = amount + taxAmount;
    $('#tax_amount').val('¥' + taxAmount.toFixed(2));
    $('#total_amount').val('¥' + totalAmount.toFixed(2));
}

async function saveReceipt(generatePdf) {
    const formData = {
        receipt_number: $('#receipt_number').val(),
        payer_name: $('#payer_name').val(),
        payer_tax_id: $('#payer_tax_id').val(),
        amount: parseFloat($('#amount').val()),
        currency: $('#currency').val(),
        payment_date: $('#payment_date').val(),
        purpose: $('#purpose').val(),
        payee_name: $('#payee_name').val(),
        payee_tax_id: $('#payee_tax_id').val(),
        tax_rate: parseFloat($('#tax_rate').val()) || 0,
        notes: $('#notes').val()
    };
    
    try {
        showLoading();
        const data = await apiRequest('/api/receipts', {
            method: 'POST',
            body: JSON.stringify(formData)
        });
        hideLoading();
        showAlert('收据保存成功！', 'success');
        if (generatePdf) {
            window.open(`/api/receipts/${data.receipt_id}/pdf`, '_blank');
        }
        $('#receiptForm')[0].reset();
        $('#payment_date').val(new Date().toISOString().split('T')[0]);
    } catch (error) {
        hideLoading();
    }
}
</script>
{% endblock %}

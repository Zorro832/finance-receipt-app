{% extends "base.html" %}

{% block title %}收据管理 - 财务收据系统{% endblock %}

{% block page_title %}收据管理{% endblock %}

{% block content %}
<!-- 搜索和筛选 -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">搜索</label>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索收据编号、付款方、事由...">
            </div>
            <div class="col-md-2 mb-3">
                <label class="form-label">币种</label>
                <select class="form-select" id="currencyFilter">
                    <option value="">全部</option>
                    <option value="CNY">¥ CNY</option>
                    <option value="USD">$ USD</option>
                    <option value="EUR">€ EUR</option>
                    <option value="GBP">£ GBP</option>
                </select>
            </div>
            <div class="col-md-2 mb-3">
                <label class="form-label">开始日期</label>
                <input type="date" class="form-control" id="dateFromFilter">
            </div>
            <div class="col-md-2 mb-3">
                <label class="form-label">结束日期</label>
                <input type="date" class="form-control" id="dateToFilter">
            </div>
            <div class="col-md-2 mb-3 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="searchBtn">
                    <i class="fas fa-search"></i> 搜索
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 收据列表 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>收据列表</span>
        <div>
            <button class="btn btn-sm btn-success" id="exportBtn">
                <i class="fas fa-download"></i> 导出
            </button>
            <button class="btn btn-sm btn-danger" id="deleteSelectedBtn" disabled>
                <i class="fas fa-trash"></i> 删除选中
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>收据编号</th>
                        <th>付款方</th>
                        <th>金额</th>
                        <th>币种</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="receiptsTable">
                    <tr>
                        <td colspan="7" class="text-center">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const limit = 20;
let selectedReceipts = new Set();

$(document).ready(function() {
    loadReceipts(1);
    
    // 搜索按钮
    $('#searchBtn').click(function() {
        loadReceipts(1);
    });
    
    // 回车搜索
    $('#searchInput').keypress(function(e) {
        if (e.which === 13) {
            loadReceipts(1);
        }
    });
    
    // 全选
    $('#selectAll').change(function() {
        const isChecked = $(this).is(':checked');
        $('input[name="receiptCheckbox"]').prop('checked', isChecked);
        updateSelectedReceipts();
    });
});

// 加载收据列表
async function loadReceipts(page) {
    try {
        showLoading();
        
        const params = new URLSearchParams({
            page: page,
            limit: limit
        });
        
        const search = $('#searchInput').val();
        if (search) params.append('search', search);
        
        const currency = $('#currencyFilter').val();
        if (currency) params.append('currency', currency);
        
        const dateFrom = $('#dateFromFilter').val();
        if (dateFrom) params.append('date_from', dateFrom);
        
        const dateTo = $('#dateToFilter').val();
        if (dateTo) params.append('date_to', dateTo);
        
        const data = await apiRequest(`/api/receipts?${params}`);
        
        hideLoading();
        renderReceipts(data.receipts);
        renderPagination(data.total_pages, page);
        
        currentPage = page;
    } catch (error) {
        hideLoading();
        console.error('加载收据失败:', error);
        $('#receiptsTable').html('<tr><td colspan="7" class="text-center text-danger">加载失败</td></tr>');
    }
}

// 渲染收据列表
function renderReceipts(receipts) {
    if (receipts.length === 0) {
        $('#receiptsTable').html('<tr><td colspan="7" class="text-center">暂无收据记录</td></tr>');
        return;
    }
    
    let html = '';
    receipts.forEach(receipt => {
        const currencySymbols = { 'CNY': '¥', 'USD': '$', 'EUR': '€', 'GBP': '£' };
        const symbol = currencySymbols[receipt.currency] || '$';
        
        html += `
            <tr>
                <td><input type="checkbox" name="receiptCheckbox" value="${receipt.id}"></td>
                <td><strong>${receipt.receipt_number}</strong></td>
                <td>${receipt.payer_name}</td>
                <td><strong class="text-primary">${symbol}${receipt.total_amount.toFixed(2)}</strong></td>
                <td><span class="badge bg-info">${receipt.currency}</span></td>
                <td>${receipt.payment_date}</td>
                <td>
                    <a href="/receipt/${receipt.id}" class="btn btn-sm btn-info" title="查看">
                        <i class="fas fa-eye"></i>
                    </a>
                    <a href="/api/receipts/${receipt.id}/pdf" class="btn btn-sm btn-danger" title="下载PDF" target="_blank">
                        <i class="fas fa-file-pdf"></i>
                    </a>
                    <button class="btn btn-sm btn-warning" onclick="deleteReceipt(${receipt.id})" title="删除">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    $('#receiptsTable').html(html);
    
    // 绑定复选框事件
    $('input[name="receiptCheckbox"]').change(updateSelectedReceipts);
}

// 渲染分页
function renderPagination(totalPages, currentPage) {
    let html = '';
    
    // 上一页
    html += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="loadReceipts(${currentPage - 1})">上一页</a>
        </li>
    `;
    
    // 页码
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="javascript:void(0)" onclick="loadReceipts(${i})">${i}</a>
                </li>
            `;
        } else if (Math.abs(i - currentPage) === 3) {
            html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
        }
    }
    
    // 下一页
    html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="loadReceipts(${currentPage + 1})">下一页</a>
        </li>
    `;
    
    $('#pagination').html(html);
}

// 更新选中的收据
function updateSelectedReceipts() {
    selectedReceipts.clear();
    $('input[name="receiptCheckbox"]:checked').each(function() {
        selectedReceipts.add($(this).val());
    });
    
    $('#deleteSelectedBtn').prop('disabled', selectedReceipts.size === 0);
}

// 删除收据
async function deleteReceipt(receiptId) {
    if (!confirm('确定要删除这张收据吗？')) {
        return;
    }
    
    try {
        await apiRequest(`/api/receipts/${receiptId}`, { method: 'DELETE' });
        showAlert('删除成功', 'success');
        loadReceipts(currentPage);
    } catch (error) {
        console.error('删除失败:', error);
    }
}

// 导出数据
$('#exportBtn').click(function() {
    showAlert('导出功能开发中...', 'info');
});
</script>
{% endblock %}
